name: pg-query
version: 0.0.1.0

extra-source-files:
  - README.md
  - CHANGELOG.md
  - PgQuery.proto

build-tools:
  - proto-lens-protoc:proto-lens-protoc

dependencies:
  # Haskell's base library, containing core types, data structures, and the
  # Prelude
  - base

  # Byte strings
  - bytestring

  # Lenses, Folds and Traversals
  - lens

  # A lens-based implementation of protocol buffers in Haskell
  - proto-lens

  # Modules that are needed by the Haskell files generated by proto-lens-protoc
  - proto-lens-runtime

  # Portable temporary file and directory support
  - temporary

  # An efficient packed Unicode text type
  - text

  # Run external processes, with strong typing of streams
  - typed-process

library:
  source-dirs: src
  when:
  - condition: false
    other-modules: Paths_pg-query
  extra-libraries:
  - pg_query
  c-sources:
    helpers/pg_query_helper.c

tests:
  pg-query-test:
    main: Spec.hs
    source-dirs: test
    build-tools: hspec-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - pg-query

    # Testing framework
    - hspec

    # Contributed functionality for Hspec
    - hspec-contrib

    # Sanely formatted and colorized diffs
    - hspec-expectations-pretty-diff

executables:
  pg-query:
    main:                Main.hs
    source-dirs:         bin
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - pg-query

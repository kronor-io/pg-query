name: pg-query
version: 0.0.1.1

license: BSD-3-Clause
license-file: LICENSE
maintainer: rhzmc@proton.me
author: rhizomic
homepage: https://git.sr.ht/~rhizomic/pg-query

synopsis: >
  Parse PostgreSQL DDL and DML: Haskell bindings for libpg_query
description: >
  pg-query offers Haskell bindings for
  @<https://github.com/pganalyze/libpg_query libpg_query>@, which makes use of
  the actual PostgreSQL server source to parse SQL queries and return the
  internal PostgreSQL parse tree.
category: Database, Data

build-type: Simple

extra-source-files:
  - README.md
  - CHANGELOG.md
  - PgQuery.proto

build-tools:
  - proto-lens-protoc:proto-lens-protoc

dependencies:
  # Haskell's base library, containing core types, data structures, and the
  # Prelude
  - base >= 4.0 && < 5.0

  # Byte strings
  - bytestring >= 0.11 && < 1.0

  # A lens-based implementation of protocol buffers in Haskell
  - proto-lens >= 0.7.1.5 && < 1.0

  # Modules that are needed by the Haskell files generated by proto-lens-protoc
  - proto-lens-runtime >= 0.7.0.6 && < 1.0

library:
  source-dirs: src
  when:
  - condition: false
    other-modules: Paths_pg_query
  extra-libraries:
  - pg_query
  c-sources:
    helpers/pg_query_helper.c

tests:
  pg-query-test:
    main: Spec.hs
    source-dirs: test
    build-tools: hspec-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - pg-query

    # Testing framework
    - hspec

    # Contributed functionality for Hspec
    - hspec-contrib

    # Sanely formatted and colorized diffs
    - hspec-expectations-pretty-diff

    # Lenses, Folds and Traversals
    - lens
